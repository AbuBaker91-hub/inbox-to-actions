[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inbox-to-actions"
version = "0.1.0"
description = "Inbound emails and PDF agreements become validated, idempotent, audited CRM records with a human review queue."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "AbuBaker" }]
dependencies = [
    "aiforge-core @ git+https://github.com/AbuBaker91-hub/aiforge-core@v0.1.0",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "httpx>=0.27", "fpdf2>=2.7"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
